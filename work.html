<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Selected architectural projects by Samuel HUANG"><title>Selected Work — Samuel HUANG</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/site.css"><script src="assets/app.js" defer></script></head>
<body><header class="topbar"><a class="wordmark" href="index.html">SH<span>—</span>STUDIO</a><nav><a class="active" href="index.html" data-zh="作品" data-en="WORK">作品</a><a href="about.html" data-zh="關於" data-en="ABOUT">關於</a></nav><button class="lang" data-language>EN</button></header>
<main class="wrap detail-page"><a class="back-link" href="index.html">← <span data-zh="所有作品" data-en="ALL WORK">所有作品</span></a><div id="project-detail"></div></main>
<footer class="footer wrap"><span>© 2026 SAMUEL HUANG 黃同榮</span><a href="about.html" data-zh="個人簡介 ↗" data-en="ABOUT ↗">個人簡介 ↗</a><span>TAIPEI, TAIWAN</span></footer>
<script>
let portfolioProjects=[];
const renderProjectDetail=(lang=localStorage.getItem('portfolio-language')||'zh')=>{
  const project=portfolioProjects.find(item=>item.id===new URLSearchParams(location.search).get('id'))||portfolioProjects[0];
  if(!project)return;
  document.title=`${lang==='en'?project.titleEn:project.titleZh} — Samuel HUANG`;
  document.querySelector('#project-detail').innerHTML=`
    <p class="eyebrow">${project.number} / ${lang==='en'?project.typeEn:project.typeZh}</p>
    <h1>${lang==='en'?project.titleEn:project.titleZh}</h1>
    <p class="detail-location">${lang==='en'?project.locationEn:project.locationZh} <span>·</span> ${project.year}</p>
    <div class="detail-art"><img src="${project.image}" alt="${lang==='en'?project.imageAltEn:project.imageAltZh}"></div>
    <div class="detail-description"><p class="eyebrow">PROJECT NOTE</p><p>${lang==='en'?project.descriptionEn:project.descriptionZh}</p></div>`;
};
fetch('data/projects.json').then(response=>response.json()).then(projects=>{portfolioProjects=projects;renderProjectDetail();});
window.addEventListener('portfolio-language-change',event=>renderProjectDetail(event.detail.lang));
</script></body></html>
